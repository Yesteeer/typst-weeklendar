name: Build manual

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v3

      - run: |
          typst compile --root ../../ doc/examples/days-box.typ
          typst compile --root ../../  doc/examples/debug.typ
          typst compile --root ../../  doc/examples/empty.typ
          typst compile --root ../../  doc/examples/event-box.typ
          typst compile --root ../../  doc/examples/long-event.typ
          typst compile --root ../../  doc/examples/multiple-days.typ
          typst compile --root ../../  doc/examples/periodic-event.typ
          typst compile --root ../../  doc/examples/single-event.typ
          typst compile --root ../../  doc/examples/title-box.typ
      - run: >-
          typst compile doc/manual.typ manual.pdf
          --root .
          --input source-url=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}

      # Latest release (updated on every push to main)
      - name: Update latest release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (master)
          files: manual.pdf
          prerelease: true
          body: |
            Auto-updated from master branch.
            Commit: ${{ github.sha }}
